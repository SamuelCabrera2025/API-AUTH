spring.application.name=authentication

# La API de autenticación usa un puerto diferente al de la API de negocio.
server.port=${AUTH_PORT:8081}

# Utiliza la misma tabla USUARIOS de Oracle, pero solamente para autenticar.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER}
spring.jpa.database-platform=${DB_DIALECT}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# JWT_SECRET debe tener al menos 32 caracteres y nunca debe subirse a Git.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
